<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2026 • Fantasy Premier League</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0b0a07;
            --bg-soft: #12100b;
            --card: #17140e;
            --card-2: #1c1811;
            --line: #d4af3722;
            --text: #f5f0da;
            --muted: #c7b887;
            --accent: #d4af37;
            --accent-2: #b98a2a;
        }
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(1200px 700px at 8% -10%, #d4af371f, transparent),
                radial-gradient(900px 500px at 90% 0%, #c08a1c1f, transparent),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(135deg, #090805 0%, #131008 45%, #0d0b06 100%);
        }
        .header::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(500px 260px at 15% 20%, #d4af372d, transparent 65%),
                radial-gradient(420px 240px at 88% 18%, #b98a2a2b, transparent 65%),
                linear-gradient(110deg, transparent 0 35%, #ffffff0c 45%, transparent 55%);
            animation: sweep 8s linear infinite;
        }
        @keyframes sweep {
            from { transform: translateX(-10%); }
            to { transform: translateX(10%); }
        }
        .header-inner {
            position: relative;
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px 24px 24px;
            display: grid;
            grid-template-columns: 1fr;
            align-items: center;
            gap: 16px;
            text-align: center;
        }
        .logo-wrap {
            display: flex;
            justify-content: center;
        }
        .hero-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 12px 30px #00000088);
            border: 1px solid #d4af3744;
            border-radius: 20px;
            background: linear-gradient(160deg, #100d08, #0d0a06);
            padding: 10px;
        }
        .title-wrap { text-align: center; }
        .title-wrap h1 {
            font-size: clamp(1.35rem, 3vw, 2.25rem);
            line-height: 1.15;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(95deg, #f8f1d7 0%, #e6c56c 40%, #d4af37 62%, #f7e7b5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.82rem;
            letter-spacing: 1.6px;
            text-transform: uppercase;
        }
        .subtitle span { color: var(--accent); font-weight: 700; }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 18px 20px 28px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }
        .stat-box {
            background: linear-gradient(160deg, var(--card), var(--card-2));
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
        }
        .stat-box .val {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(120deg, #f5e3ab, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-box .lbl {
            font-size: 0.73rem;
            color: var(--muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .shell {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 14px;
            align-items: start;
        }
        .nav-card,
        .content-card {
            border: 1px solid var(--line);
            background: linear-gradient(170deg, var(--card), var(--card-2));
            border-radius: 16px;
            box-shadow: 0 12px 30px #00000040;
        }
        .nav-card {
            position: sticky;
            top: 12px;
            padding: 12px;
        }
        .nav-title {
            color: #e6c56c;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            margin: 2px 4px 10px;
        }
        .tabs {
            display: grid;
            gap: 8px;
        }
        .tab {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #ffffff05;
            color: #f3e9c6;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab:hover { border-color: #d4af3750; background: #ffffff10; }
        .tab.active {
            color: #fff;
            border-color: transparent;
            background: linear-gradient(135deg, #b98a2a, #d4af37);
            box-shadow: 0 8px 18px #d4af3755;
        }

        .content-card { padding: 14px; }
        .panel { display: none; animation: fadeIn 0.22s ease; }
        .panel.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .leaderboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
        .team-card {
            position: relative;
            border: 1px solid var(--line);
            background: linear-gradient(160deg, #1a160f, #141109);
            border-radius: 14px;
            padding: 14px;
        }
        .team-card .rank-badge {
            position: absolute;
            right: 12px;
            top: 12px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 0.75rem;
            border: 1px solid #d4af3738;
            background: #d4af3718;
        }
        .team-card h3 {
            font-size: 1rem;
            margin-bottom: 3px;
            cursor: pointer;
            user-select: none;
        }
        .team-title { display: inline-flex; align-items: center; gap: 8px; }
        .team-logo {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.35px;
            background: radial-gradient(circle at 30% 30%, #ffffff33, transparent 45%), var(--logo, #64748b);
            border: 1px solid #ffffff24;
            position: relative;
            overflow: hidden;
        }
        .team-logo img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .team-logo-fallback {
            position: relative;
            z-index: 1;
        }
        .team-card h3::after { content: ' ▸'; color: #bda25f; font-size: 0.75rem; display: inline-block; transition: transform 0.24s; }
        .team-card.expanded h3::after { transform: rotate(90deg); }
        .team-card .owner { color: var(--muted); font-size: 0.78rem; margin-bottom: 10px; }
        .team-card .total {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(110deg, #f8e7ba, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .team-card .players { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
        .team-card.expanded .players { max-height: 520px; overflow-y: auto; }
        .team-card .player-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            padding: 5px 0;
            border-bottom: 1px dashed #ffffff14;
        }
        .team-card .player-row:last-child { border-bottom: none; }
        .team-card .player-row .pts { color: #f3d277; font-weight: 700; }
        .team-card .player-row .no-pts { color: #64748b; }

        .search {
            width: 100%;
            border: 1px solid #ffffff1f;
            background: #ffffff08;
            border-radius: 999px;
            color: #e8e8f0;
            font-size: 0.92rem;
            padding: 12px 16px;
            margin-bottom: 10px;
        }
        .search:focus { outline: none; border-color: #d4af37; box-shadow: 0 0 0 3px #d4af3738; }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
            background: #11162a;
        }
        th, td { padding: 11px 12px; border-bottom: 1px solid #ffffff10; text-align: left; }
        th {
            position: sticky;
            top: 0;
            z-index: 1;
            font-size: 0.74rem;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #e5cf8b;
            background: #1a160f;
            cursor: pointer;
            font-weight: 700;
        }
        td { font-size: 0.84rem; }
        tr:hover td { background: #ffffff08; }
        .rank { color: #d9bb62; font-weight: 700; }
        .team-cell { display: flex; align-items: center; gap: 8px; }
        .team-cell .team-logo { width: 20px; height: 20px; font-size: 0.52rem; }

        .metric-switcher {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .metric-btn {
            border: 1px solid var(--line);
            background: #ffffff08;
            color: #f3e9c6;
            border-radius: 999px;
            padding: 7px 11px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
        }
        /* Larger crest in Team Leaderboard cards */
        .team-card .team-logo {
            width: 36px;
            height: 36px;
            font-size: 0.8rem;
        }
        .metric-btn.active {
            color: #fff;
            border-color: transparent;
            background: linear-gradient(130deg, #b98a2a, #d4af37);
        }
        .comparison-wrap { display: grid; gap: 10px; }
        .podium {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }
        .podium-card {
            border: 1px solid #ffffff18;
            background: linear-gradient(160deg, #1b2140, #151b33);
            border-radius: 12px;
            padding: 10px;
            display: grid;
            gap: 6px;
        }
        .podium-top { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: #e9d598; }
        .podium-points { font-weight: 800; color: #f3d277; }
        .podium-name { font-weight: 700; font-size: 0.9rem; color: #f5f5ff; }
        .podium-meta { font-size: 0.73rem; color: #94a3b8; }
        .podium-bar-track { height: 7px; background: #ffffff12; border-radius: 999px; overflow: hidden; }
        .podium-bar-fill { height: 100%; width: 0; transition: width 0.7s ease; }

        .comp-list {
            border: 1px solid #ffffff18;
            border-radius: 12px;
            background: linear-gradient(160deg, #1b2140, #151b33);
            padding: 8px;
            display: grid;
            gap: 6px;
        }
        .comp-row { display: grid; grid-template-columns: 28px 1fr 85px; gap: 10px; align-items: center; }
        .comp-rank {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 0.72rem;
            font-weight: 800;
            color: #ddd6fe;
            background: #ffffff12;
            border: 1px solid #ffffff1c;
        }
        .comp-main { min-width: 0; }
        .comp-name { font-size: 0.84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .comp-sub { font-size: 0.72rem; color: #94a3b8; margin-top: 2px; }
        .comp-track { height: 6px; margin-top: 5px; background: #ffffff10; border-radius: 999px; overflow: hidden; }
        .comp-fill { height: 100%; width: 0; transition: width 0.7s ease; }
        .comp-points { text-align: right; font-size: 0.82rem; font-weight: 800; color: #f3d277; }

        @media (max-width: 980px) {
            .shell { grid-template-columns: 1fr; }
            .nav-card { position: static; }
            .tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); display: grid; }
            .tab { text-align: center; }
        }
        @media (max-width: 760px) {
            .header-inner { grid-template-columns: 1fr; text-align: center; }
            .hero-logo { width: min(420px, 92vw); }
            .podium { grid-template-columns: 1fr; }
            .comp-row { grid-template-columns: 24px 1fr 70px; }
            .tabs { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo-wrap">
                <img class="hero-logo" src="assets/brand/cricket-auctions-mark.svg" alt="Cricket Auctions mark">
            </div>
            <div class="title-wrap">
                <h1>Cricket Auctions  IPL 2026 </h1>
                <p class="subtitle"> Updated <span id="updated"></span></p>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="stats" id="summary-stats"></div>

        <section class="shell">
            <aside class="nav-card">
                <div class="nav-title">Sections</div>
                <div class="tabs">
                    <div class="tab active" data-tab="teams">🏆 Team Leaderboard</div>
                    <div class="tab" data-tab="players">👤 All Players</div>
                    <div class="tab" data-tab="chart">📊 Comparison</div>
                </div>
            </aside>

            <section class="content-card">
                <div class="panel active" id="panel-teams">
                    <div class="leaderboard" id="leaderboard"></div>
                </div>

                <div class="panel" id="panel-players">
                    <input class="search" id="player-search" placeholder="Search player or team..." />
                    <div style="overflow-x:auto; border-radius: 12px;">
                        <table id="player-table">
                            <thead>
                                <tr>
                                    <th>#</th><th>Player</th><th>Team</th><th>Points</th><th>Matches</th><th>Avg Pts</th><th>Runs</th><th>Wickets</th><th>Catches</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <div class="panel" id="panel-chart">
                    <h3 id="comparison-title" style="margin: 2px 0 10px; color:#c4b5fd; font-size:1rem;">Top Players by Points</h3>
                    <div class="metric-switcher" id="metric-switcher">
                        <button class="metric-btn active" data-metric="totalPoints">Points</button>
                        <button class="metric-btn" data-metric="runs">Runs</button>
                        <button class="metric-btn" data-metric="wickets">Wickets</button>
                        <button class="metric-btn" data-metric="catches">Catches</button>
                        <button class="metric-btn" data-metric="avgPoints">Avg Pts</button>
                    </div>
                    <div class="comparison-wrap">
                        <div class="podium" id="podium-chart"></div>
                        <div class="comp-list" id="comp-chart"></div>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <script>
    let TEAMS = [], PLAYERS = [];
    let comparisonMetric = 'totalPoints';
    const COLORS = ['#7c3aed','#a855f7','#ec4899','#f43f5e','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6'];
    const METRIC_META = {
        totalPoints: { label: 'Points', decimals: 0 },
        runs: { label: 'Runs', decimals: 0 },
        wickets: { label: 'Wickets', decimals: 0 },
        catches: { label: 'Catches', decimals: 0 },
        avgPoints: { label: 'Avg Pts', decimals: 1 }
    };
    const TEAM_LOGOS = {
        'ESCN 11': { abbr: 'E11', color: '#7c3aed', logo: 'assets/team-logos/escn11.png' },
        'Madmax Xl': { abbr: 'MMX', color: '#ec4899', logo: 'assets/team-logos/madmax-xl.png' },
        "Patil's X1": { abbr: 'PX1', color: '#06b6d4', logo: 'assets/team-logos/patils-x1.png' },
        'Backfoot Bazball 11': { abbr: 'BB11', color: '#f97316', logo: 'assets/team-logos/backfoot-bazball-11.png' },
        'Bevarsi Brothers CC': { abbr: 'BBC', color: '#22c55e', logo: 'assets/team-logos/bevarsi-brothers-cc.png' },
        'Ferrari XI': { abbr: 'FXI', color: '#ef4444', logo: 'assets/team-logos/ferrari-xi.png' },
        'Bowl Movement': { abbr: 'BM', color: '#84cc16', logo: 'assets/team-logos/bowl-movement.png' },
        'RCBCSK X1': { abbr: 'RCX', color: '#3b82f6', logo: 'assets/team-logos/rcbcsk-x1.png' },
        'Wicket Warriors': { abbr: 'WW', color: '#a855f7', logo: 'assets/team-logos/wicket-warriors.png' }
    };

    async function loadData() {
        const resp = await fetch('data.json');
        const data = await resp.json();
        TEAMS = data.teams;
        PLAYERS = data.players;
        document.getElementById('updated').textContent = data.updated || 'N/A';
        render();
    }

    function render() {
        const sorted = [...TEAMS].sort((a, b) => b.totalPoints - a.totalPoints);
        const topTeam = sorted[0];
        const topPlayer = PLAYERS.length > 0 ? PLAYERS.reduce((a, b) => (a.totalPoints||0) > (b.totalPoints||0) ? a : b) : null;
        document.getElementById('summary-stats').innerHTML = `
            <div class="stat-box"><div class="val">${TEAMS.length}</div><div class="lbl">Teams</div></div>
            <div class="stat-box"><div class="val">${PLAYERS.length}</div><div class="lbl">Players</div></div>
            <div class="stat-box"><div class="val">${topTeam ? topTeam.totalPoints : '-'}</div><div class="lbl">Top Team • ${topTeam ? topTeam.name : '-'}</div></div>
            <div class="stat-box"><div class="val">${topPlayer ? topPlayer.totalPoints : '-'}</div><div class="lbl">Top Player • ${topPlayer ? topPlayer.name : '-'}</div></div>
        `;
        renderTeams();
        renderPlayers();
        renderChart();
    }

    function getTeamLogoMeta(teamName) {
        if (TEAM_LOGOS[teamName]) return TEAM_LOGOS[teamName];
        const abbr = String(teamName || '')
            .split(/\s+/)
            .filter(Boolean)
            .slice(0, 2)
            .map(w => w[0])
            .join('')
            .toUpperCase() || 'TM';
        return { abbr, color: '#64748b' };
    }

    function teamLogoHtml(teamName) {
        const { abbr, color, logo } = getTeamLogoMeta(teamName);
        const img = logo
            ? `<img src="${logo}" alt="${teamName} logo" onerror="this.remove()">`
            : '';
        return `<span class="team-logo" style="--logo:${color}" title="${teamName}">${img}<span class="team-logo-fallback">${abbr}</span></span>`;
    }

    function metricValue(player, metric) {
        const v = Number(player?.[metric] ?? 0);
        return Number.isFinite(v) ? v : 0;
    }

    function formatMetricValue(value, metric) {
        const decimals = METRIC_META[metric]?.decimals ?? 0;
        return Number(value).toFixed(decimals);
    }

    function setMetricButtonsState() {
        document.querySelectorAll('#metric-switcher .metric-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.metric === comparisonMetric);
        });
        const title = document.getElementById('comparison-title');
        if (title) title.textContent = `Top Players by ${METRIC_META[comparisonMetric].label}`;
    }

    function renderTeams() {
        const sorted = [...TEAMS].sort((a, b) => b.totalPoints - a.totalPoints);
        document.getElementById('leaderboard').innerHTML = sorted.map((t, i) => {
            const cls = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
            const badge = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
            return `
            <div class="team-card ${cls}">
                <div class="rank-badge">${badge}</div>
                <h3><span class="team-title">${teamLogoHtml(t.name)}<span>${t.name}</span></span></h3>
                <div class="owner">${t.owner}</div>
                <div class="total">${t.totalPoints}</div>
                <div class="players">
                    ${t.players
                        .sort((a, b) => (b.points || 0) - (a.points || 0))
                        .map(p => `
                        <div class="player-row">
                            <span>${p.name}</span>
                            <span class="${p.points ? 'pts' : 'no-pts'}">${p.points || '-'}</span>
                        </div>`)
                        .join('')}
                </div>
            </div>`;
        }).join('');
    }

    let sortCol = 3, sortAsc = false;
    function renderPlayers(filter = '') {
        const tbody = document.querySelector('#player-table tbody');
        let list = PLAYERS;
        if (filter) list = list.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.team.toLowerCase().includes(filter.toLowerCase()));
        list = [...list].sort((a, b) => {
            const keys = ['name', 'name', 'team', 'totalPoints', 'matches', 'avgPoints', 'runs', 'wickets', 'catches'];
            let va = a[keys[sortCol]] ?? 0, vb = b[keys[sortCol]] ?? 0;
            if (typeof va === 'string') return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
            return sortAsc ? va - vb : vb - va;
        });
        tbody.innerHTML = list.map((p, i) => `
            <tr>
                <td class="rank">${i + 1}</td>
                <td>${p.name}</td>
                <td class="team-cell">${teamLogoHtml(p.team)}<span class="team-cell-name">${p.team}</span></td>
                <td><b>${p.totalPoints || '-'}</b></td>
                <td>${p.matches || '-'}</td>
                <td>${p.avgPoints || '-'}</td>
                <td>${p.runs || '-'}</td>
                <td>${p.wickets || '-'}</td>
                <td>${p.catches || '-'}</td>
            </tr>`).join('');
    }

    function renderChart() {
        const sorted = [...PLAYERS]
            .filter(p => metricValue(p, comparisonMetric) > 0)
            .sort((a, b) => metricValue(b, comparisonMetric) - metricValue(a, comparisonMetric))
            .slice(0, 15);
        const max = metricValue(sorted[0], comparisonMetric) || 1;

        const podiumEl = document.getElementById('podium-chart');
        podiumEl.innerHTML = sorted.slice(0, 3).map((p, i) => `
            <div class="podium-card">
                <div class="podium-top">
                    <div>${i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉'}</div>
                    <div class="podium-points">${formatMetricValue(metricValue(p, comparisonMetric), comparisonMetric)}</div>
                </div>
                <div class="podium-name">${p.name}</div>
                <div class="podium-meta">${p.team} • ${p.matches} Matches</div>
                <div class="podium-bar-track">
                    <div class="podium-bar-fill" style="width:${(metricValue(p, comparisonMetric) / max) * 100}%; background: linear-gradient(to right, ${COLORS[i % COLORS.length]}99, ${COLORS[i % COLORS.length]});"></div>
                </div>
            </div>`).join('');

        const compEl = document.getElementById('comp-chart');
        compEl.innerHTML = sorted.map((p, i) => `
            <div class="comp-row">
                <div class="comp-rank">${i + 1}</div>
                <div class="comp-main">
                    <div class="comp-name">${p.name}</div>
                    <div class="comp-sub">${p.team}</div>
                    <div class="comp-track">
                        <div class="comp-fill" style="width:${(metricValue(p, comparisonMetric) / max) * 100}%; background: linear-gradient(to right, ${COLORS[i % COLORS.length]}99, ${COLORS[i % COLORS.length]});"></div>
                    </div>
                </div>
                <div class="comp-points">${formatMetricValue(metricValue(p, comparisonMetric), comparisonMetric)}</div>
            </div>`).join('');

        setMetricButtonsState();
    }

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        });
    });

    document.getElementById('player-search').addEventListener('input', e => renderPlayers(e.target.value));
    document.getElementById('leaderboard').addEventListener('click', e => {
        const card = e.target.closest('.team-card');
        if (!card) return;
        if (e.target.closest('.players')) return;
        card.classList.toggle('expanded');
    });
    document.querySelectorAll('#player-table th').forEach((th, i) => {
        th.addEventListener('click', () => {
            if (sortCol === i) sortAsc = !sortAsc;
            else { sortCol = i; sortAsc = false; }
            renderPlayers(document.getElementById('player-search').value);
        });
    });
    document.getElementById('metric-switcher').addEventListener('click', e => {
        const btn = e.target.closest('.metric-btn');
        if (!btn) return;
        const m = btn.dataset.metric;
        if (!METRIC_META[m]) return;
        comparisonMetric = m;
        renderChart();
    });

    loadData();
    </script>
</body>
</html>
